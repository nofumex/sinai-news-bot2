[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sinai-crm-bot"
version = "1.0.0"
description = "Polling Telegram/MAX subscriber bot with durable SQLite queues"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1.0,<2", "python-dateutil>=2.9,<3", "phonenumbers>=9,<10", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
sinai-bot = "sinai.main:cli"

[tool.setuptools.packages.find]
include = ["sinai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

